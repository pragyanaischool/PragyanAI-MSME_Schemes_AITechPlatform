services:
  - type: web
    name: msme-navigator-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: msme-postgres-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: msme-postgres-db
    plan: free
    databaseName: msmedb
    user: msme_admin
