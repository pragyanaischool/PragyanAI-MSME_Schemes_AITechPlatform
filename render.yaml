services:
  # 1. FastAPI Production Backend
  - type: web
    name: msme-navigator-backend
    runtime: python
    rootDir: backend
    plan: standard
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 4"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: msme-postgres-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.8

databases:
  # 2. Render Managed PostgreSQL Database
  - name: msme-postgres-db
    databaseName: msmedb
    user: msme_admin
    plan: standard
    postgresMajorVersion: 15
